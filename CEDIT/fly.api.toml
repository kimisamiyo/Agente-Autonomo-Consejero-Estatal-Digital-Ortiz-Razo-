# Fly.io — API CEDIT (app: cedit-api)
# Deploy: fly deploy --config fly.api.toml -a cedit-api

app = 'cedit-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile.api'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '45s'
    timeout = '15s'
    grace_period = '5m'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
