# Fly.io — API CEDIT (FastAPI + uvicorn en puerto 8080 dentro del contenedor).
# Fly proxy público → internal_port 8080 (correcto; no es un error).
# Deploy: fly deploy --config fly.api.toml -a cedit-api

app = 'cedit-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile.api'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '5m'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
