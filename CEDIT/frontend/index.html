    <script>
      try {
        var s = JSON.parse(localStorage.getItem('cedit_user_settings') || '{}');
        if (s.colorMode === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.colorScheme = 'dark';
        }
        var tone = s.paletteTone === 'steel' || s.paletteTone === 'graphite' ? s.paletteTone : 'mist';
        document.documentElement.dataset.palette = tone;
      } catch (e) {}
    </script>
